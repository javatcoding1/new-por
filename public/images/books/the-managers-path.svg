<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1600" width="1050" height="1600">
  <defs>
    <linearGradient id="bg-tmp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="accent-tmp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1050" height="1600" fill="url(#bg-tmp)"/>
  
  <!-- Outer border framing -->
  <rect x="60" y="60" width="930" height="1480" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="74" y="74" width="902" height="1452" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Top badge -->
  <rect x="300" y="160" width="450" height="48" rx="24" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="525" y="192" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="4">O'REILLY TECH LEADERSHIP</text>

  <!-- Title -->
  <text x="525" y="440" fill="#ffffff" font-family="Georgia, serif" font-size="94" font-weight="bold" text-anchor="middle" letter-spacing="2">THE</text>
  <text x="525" y="550" fill="url(#accent-tmp)" font-family="Georgia, serif" font-size="94" font-weight="bold" text-anchor="middle" letter-spacing="2">MANAGER'S</text>
  <text x="525" y="660" fill="#ffffff" font-family="Georgia, serif" font-size="94" font-weight="bold" text-anchor="middle" letter-spacing="2">PATH</text>

  <!-- Subtitle -->
  <text x="525" y="740" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" text-anchor="middle" letter-spacing="1">A GUIDE FOR TECH LEADERS NAVIGATING GROWTH &amp; CHANGE</text>

  <!-- Divider -->
  <line x1="220" y1="780" x2="830" y2="780" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Stepped Path Visualization: Engineer -> Tech Lead -> Manager -> Director -> VP -> CTO -->
  <g transform="translate(160, 850)">
    <!-- Path Line -->
    <path d="M 40,220 L 160,180 L 290,140 L 430,90 L 570,40 L 690,0" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,6"/>
    
    <!-- Steps Nodes -->
    <circle cx="40" cy="220" r="16" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
    <text x="40" y="265" fill="#d4d4d8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Mentor</text>

    <circle cx="160" cy="180" r="16" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
    <text x="160" y="225" fill="#d4d4d8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Tech Lead</text>

    <circle cx="290" cy="140" r="18" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="290" y="185" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Team Lead</text>

    <circle cx="430" cy="90" r="18" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
    <text x="430" y="135" fill="#d4d4d8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Managing Mgrs</text>

    <circle cx="570" cy="40" r="20" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
    <text x="570" y="85" fill="#d4d4d8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Director</text>

    <circle cx="690" cy="0" r="22" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
    <text x="690" y="-25" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">VP / CTO</text>
  </g>

  <!-- Author -->
  <text x="525" y="1220" fill="#ffffff" font-family="Georgia, serif" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="3">CAMILLE FOURNIER</text>
  <text x="525" y="1270" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle" letter-spacing="2">FORMER CTO OF RENT THE RUNWAY</text>

  <!-- Quote banner at bottom -->
  <rect x="120" y="1350" width="810" height="110" rx="12" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  <text x="525" y="1395" fill="#f8fafc" font-family="Georgia, italic" font-size="21" text-anchor="middle">"Management is a career change, not a promotion.</text>
  <text x="525" y="1430" fill="#f8fafc" font-family="Georgia, italic" font-size="21" text-anchor="middle">A roadmap for navigating the journey."</text>
</svg>
