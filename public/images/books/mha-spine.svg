<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-mha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-mha)"/>

  <!-- Top Jump Comics Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#e11d48"/>
  <text x="110" y="85" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle">JUMP</text>

  <!-- Big Volume Number 1 -->
  <circle cx="110" cy="200" r="50" fill="#facc15"/>
  <text x="110" y="222" fill="#0f172a" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- All Might / Deku Mask Emblem -->
  <circle cx="110" cy="320" r="28" fill="#15803d"/>
  <path d="M 92,310 L 110,335 L 128,310 Z" fill="#facc15"/>

  <!-- Vertical "MY HERO ACADEMIA" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#ffffff" stroke="#0f172a" stroke-width="8" font-family="'Arial Black', Impact, sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="4">MY HERO ACADEMIA</text>
    <text x="110" y="760" fill="#fef08a" font-family="'Arial Black', Impact, sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="4">MY HERO ACADEMIA</text>
  </g>

  <!-- Japanese Katakana -->
  <g transform="rotate(-90 110 1160)">
    <text x="110" y="1170" fill="#e0f2fe" font-family="'Noto Sans JP', sans-serif" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">僕のヒーローアカデミア</text>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">HORIKOSHI</text>
  </g>

  <!-- Bottom VIZ badge -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#0f172a"/>
  <text x="110" y="1525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">VIZ</text>
</svg>
