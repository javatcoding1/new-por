<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-bluelock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-bluelock)"/>

  <!-- Top KC Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#18181b"/>
  <text x="110" y="85" fill="#38bdf8" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle">KODANSHA</text>

  <!-- Big Volume Number 1 with target ring -->
  <circle cx="110" cy="200" r="50" fill="#111827" stroke="#38bdf8" stroke-width="4"/>
  <text x="110" y="222" fill="#38bdf8" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- Blue Lock Pentagon / Soccer motif -->
  <polygon points="110,290 140,312 128,348 92,348 80,312" fill="#38bdf8" opacity="0.9"/>
  <polygon points="110,298 132,314 123,342 97,342 88,314" fill="#0c4a6e"/>

  <!-- Vertical "BLUE LOCK" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#ffffff" stroke="#082f49" stroke-width="8" stroke-linejoin="round" font-family="'Arial Black', Impact, sans-serif" font-size="82" font-weight="900" text-anchor="middle" letter-spacing="8">BLUE LOCK</text>
    <text x="110" y="760" fill="#e0f2fe" font-family="'Arial Black', Impact, sans-serif" font-size="82" font-weight="900" text-anchor="middle" letter-spacing="8">BLUE LOCK</text>
  </g>

  <!-- Metavision puzzle icon -->
  <g transform="translate(110, 1160)" scale="0.8">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="3">KANESHIRO</text>
  </g>

  <!-- Bottom Kodansha logo -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#111827"/>
  <text x="110" y="1525" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">BLUE LOCK</text>
</svg>
