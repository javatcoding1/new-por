<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-berserk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-berserk)"/>

  <!-- Top Dark Horse Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#7f1d1d"/>
  <text x="110" y="85" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" text-anchor="middle">DH</text>

  <!-- Big Volume Number 1 -->
  <circle cx="110" cy="200" r="50" fill="#dc2626"/>
  <text x="110" y="222" fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- Brand rune icon -->
  <polygon points="110,290 125,320 110,340 95,320" fill="#ef4444"/>

  <!-- Vertical "BERSERK" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#ffffff" stroke="#7f1d1d" stroke-width="8" font-family="'Arial Black', Impact, sans-serif" font-size="94" font-weight="900" text-anchor="middle" letter-spacing="8">BERSERK</text>
    <text x="110" y="760" fill="#fca5a5" font-family="'Arial Black', Impact, sans-serif" font-size="94" font-weight="900" text-anchor="middle" letter-spacing="8">BERSERK</text>
  </g>

  <!-- Japanese Kanji -->
  <g transform="rotate(-90 110 1160)">
    <text x="110" y="1170" fill="#ef4444" font-family="'Noto Sans JP', serif" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="8">ベルセルク</text>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">MIURA</text>
  </g>

  <!-- Bottom Dark Horse badge -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#7f1d1d"/>
  <text x="110" y="1525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">HORSE</text>
</svg>
