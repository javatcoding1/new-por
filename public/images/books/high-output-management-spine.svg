<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-hom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-hom)"/>

  <!-- Top accent bars -->
  <rect x="25" y="60" width="170" height="6" fill="#48cae4"/>
  <rect x="25" y="80" width="170" height="2" fill="#48cae4" opacity="0.6"/>

  <!-- Rotated Title Text -->
  <g transform="rotate(-90 110 720)">
    <text x="110" y="730" fill="#ffffff" font-family="Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle" letter-spacing="4">HIGH OUTPUT MANAGEMENT</text>
  </g>

  <!-- Mid accent badge -->
  <circle cx="110" cy="1150" r="18" fill="none" stroke="#48cae4" stroke-width="2"/>
  <circle cx="110" cy="1150" r="8" fill="#48cae4"/>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1340)">
    <text x="110" y="1350" fill="#90e0ef" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="600" text-anchor="middle" letter-spacing="3">ANDREW S. GROVE</text>
  </g>

  <!-- Bottom accent bars -->
  <rect x="25" y="1520" width="170" height="2" fill="#48cae4" opacity="0.6"/>
  <rect x="25" y="1534" width="170" height="6" fill="#48cae4"/>
</svg>
