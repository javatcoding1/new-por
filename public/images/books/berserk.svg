<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1600" width="1050" height="1600">
  <defs>
    <linearGradient id="bg-berserk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="blood-berserk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="1050" height="1600" fill="url(#bg-berserk)"/>

  <!-- Top Dark Horse banner -->
  <rect x="0" y="0" width="1050" height="100" fill="#0c0a09" fill-opacity="0.7"/>
  <rect x="60" y="22" width="240" height="56" rx="8" fill="#7f1d1d"/>
  <text x="180" y="60" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">DARK HORSE MANGA</text>
  <text x="960" y="65" fill="#dc2626" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" text-anchor="end">VOL. 1</text>

  <!-- Brand of Sacrifice Rune Emblem -->
  <g transform="translate(525, 470)">
    <!-- Blood glow circle -->
    <circle cx="0" cy="0" r="170" fill="#7f1d1d" fill-opacity="0.2" stroke="#dc2626" stroke-width="4" stroke-dasharray="10,6"/>
    <!-- Brand of Sacrifice Rune -->
    <path d="M 0,-140 L 0,140 M 0,-70 L -60,-120 M 0,-70 L 60,-120 M -60,-120 L -60,40 L 0,100 L 60,40 L 60,-120 M -60,-20 L 60,-20" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blood drops -->
    <circle cx="0" cy="170" r="8" fill="#dc2626"/>
    <circle cx="-30" cy="185" r="5" fill="#dc2626"/>
  </g>

  <!-- Big Stylized "BERSERK" Title -->
  <g transform="translate(525, 830)">
    <text x="0" y="8" fill="#450a0a" font-family="'Arial Black', Impact, sans-serif" font-size="160" font-weight="900" text-anchor="middle" letter-spacing="10">BERSERK</text>
    <text x="0" y="0" fill="url(#blood-berserk)" stroke="#0c0a09" stroke-width="14" stroke-linejoin="round" font-family="'Arial Black', Impact, sans-serif" font-size="160" font-weight="900" text-anchor="middle" letter-spacing="10">BERSERK</text>
    <text x="0" y="0" fill="url(#blood-berserk)" font-family="'Arial Black', Impact, sans-serif" font-size="160" font-weight="900" text-anchor="middle" letter-spacing="10">BERSERK</text>
  </g>

  <!-- Japanese Kanji: ベルセルク -->
  <text x="525" y="950" fill="#fca5a5" font-family="'Noto Sans JP', serif" font-size="48" font-weight="bold" text-anchor="middle" letter-spacing="18">ベルセルク</text>

  <!-- Volume Subtitle: THE BLACK SWORDSMAN -->
  <rect x="220" y="1050" width="610" height="74" rx="14" fill="#0c0a09" fill-opacity="0.8" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="1098" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="4">THE BLACK SWORDSMAN — 黒い剣士</text>

  <!-- Author Kentaro Miura -->
  <text x="525" y="1320" fill="#ffffff" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" letter-spacing="6">KENTARO MIURA</text>
  <text x="525" y="1375" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="8">STORY &amp; ART (1966 – 2021)</text>

  <!-- Bottom Bar -->
  <line x1="120" y1="1460" x2="930" y2="1460" stroke="#dc2626" stroke-width="4" stroke-opacity="0.6"/>
  <text x="525" y="1510" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="6">DARK HORSE MANGA</text>
</svg>
