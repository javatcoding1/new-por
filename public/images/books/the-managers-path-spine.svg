<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-tmp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-tmp)"/>

  <!-- Top accent bars -->
  <rect x="25" y="60" width="170" height="6" fill="#f59e0b"/>
  <rect x="25" y="80" width="170" height="2" fill="#f59e0b" opacity="0.6"/>

  <!-- Rotated Title Text -->
  <g transform="rotate(-90 110 720)">
    <text x="110" y="730" fill="#ffffff" font-family="Georgia, serif" font-size="54" font-weight="bold" text-anchor="middle" letter-spacing="4">THE MANAGER'S PATH</text>
  </g>

  <!-- Mid accent diamond -->
  <polygon points="110,1130 125,1150 110,1170 95,1150" fill="#f59e0b"/>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1340)">
    <text x="110" y="1350" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="600" text-anchor="middle" letter-spacing="3">CAMILLE FOURNIER</text>
  </g>

  <!-- Bottom accent bars -->
  <rect x="25" y="1520" width="170" height="2" fill="#f59e0b" opacity="0.6"/>
  <rect x="25" y="1534" width="170" height="6" fill="#f59e0b"/>
</svg>
