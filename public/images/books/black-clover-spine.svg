<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-bc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-bc)"/>

  <!-- Top Jump Comics Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#e11d48"/>
  <text x="110" y="85" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle">JUMP</text>

  <!-- Big Volume Number 1 -->
  <circle cx="110" cy="200" r="50" fill="#ca8a04"/>
  <text x="110" y="222" fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- Five-leaf Clover emblem -->
  <circle cx="110" cy="320" r="26" fill="#18181b"/>
  <polygon points="110,298 120,314 136,314 124,324 128,340 110,330 92,340 96,324 84,314 100,314" fill="#facc15"/>

  <!-- Vertical "BLACK CLOVER" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#ffffff" stroke="#ca8a04" stroke-width="6" font-family="'Arial Black', Impact, sans-serif" font-size="82" font-weight="900" text-anchor="middle" letter-spacing="6">BLACK CLOVER</text>
    <text x="110" y="760" fill="#facc15" font-family="'Arial Black', Impact, sans-serif" font-size="82" font-weight="900" text-anchor="middle" letter-spacing="6">BLACK CLOVER</text>
  </g>

  <!-- Japanese Katakana -->
  <g transform="rotate(-90 110 1160)">
    <text x="110" y="1170" fill="#fde047" font-family="'Noto Sans JP', sans-serif" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="8">ブラッククローバー</text>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">TABATA</text>
  </g>

  <!-- Bottom VIZ badge -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#27272a"/>
  <text x="110" y="1525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">VIZ</text>
</svg>
