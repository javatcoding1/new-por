<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-naruto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-naruto)"/>

  <!-- Top Jump Comics Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#e11d48"/>
  <text x="110" y="85" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle">JUMP</text>

  <!-- Big Volume Number 1 -->
  <circle cx="110" cy="200" r="50" fill="#ffffff"/>
  <text x="110" y="222" fill="#ea580c" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- Konoha symbol -->
  <circle cx="110" cy="320" r="28" fill="#18181b"/>
  <path d="M 100,315 C 95,315 90,320 95,328 C 100,335 110,335 115,325 C 120,315 125,310 132,305" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>

  <!-- Vertical "NARUTO" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#ffffff" stroke="#111111" stroke-width="8" stroke-linejoin="round" font-family="'Arial Black', Impact, sans-serif" font-size="90" font-weight="900" text-anchor="middle" letter-spacing="8">NARUTO</text>
    <text x="110" y="760" fill="#fef08a" font-family="'Arial Black', Impact, sans-serif" font-size="90" font-weight="900" text-anchor="middle" letter-spacing="8">NARUTO</text>
  </g>

  <!-- Uzumaki spiral icon -->
  <g transform="translate(110, 1160)" scale="0.7">
    <circle cx="0" cy="0" r="30" fill="#c2410c"/>
    <circle cx="0" cy="0" r="16" fill="#fef08a"/>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">KISHIMOTO</text>
  </g>

  <!-- Bottom VIZ logo -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#111111"/>
  <text x="110" y="1525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">VIZ</text>
</svg>
