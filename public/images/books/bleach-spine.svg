<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 1600" width="220" height="1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spine-bg-bleach" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="220" height="1600" fill="url(#spine-bg-bleach)"/>

  <!-- Top Jump Comics Logo -->
  <rect x="25" y="40" width="170" height="70" rx="10" fill="#e11d48"/>
  <text x="110" y="85" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle">JUMP</text>

  <!-- Big Volume Number 1 -->
  <circle cx="110" cy="200" r="50" fill="#09090b"/>
  <text x="110" y="222" fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" text-anchor="middle">1</text>

  <!-- Skull icon -->
  <circle cx="110" cy="320" r="26" fill="#f97316"/>
  <circle cx="102" cy="316" r="6" fill="#ffffff"/>
  <circle cx="118" cy="316" r="6" fill="#ffffff"/>

  <!-- Vertical "BLEACH" Title -->
  <g transform="rotate(-90 110 740)">
    <text x="110" y="760" fill="#09090b" font-family="'Arial Black', Impact, sans-serif" font-size="100" font-weight="900" text-anchor="middle" letter-spacing="10">BLEACH</text>
  </g>

  <!-- Small Japanese title -->
  <g transform="rotate(-90 110 1160)">
    <text x="110" y="1170" fill="#f97316" font-family="'Noto Sans JP', sans-serif" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="8">ブリーチ</text>
  </g>

  <!-- Rotated Author Text -->
  <g transform="rotate(-90 110 1350)">
    <text x="110" y="1362" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="4">TITE KUBO</text>
  </g>

  <!-- Bottom VIZ logo -->
  <rect x="35" y="1490" width="150" height="50" rx="8" fill="#09090b"/>
  <text x="110" y="1525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">VIZ</text>
</svg>
