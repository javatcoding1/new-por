<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1600" width="1050" height="1600">
  <defs>
    <linearGradient id="bg-dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1050" height="1600" fill="url(#bg-dn)"/>

  <!-- Leather notebook texture border -->
  <rect x="50" y="50" width="950" height="1500" fill="none" stroke="#27272a" stroke-width="4"/>
  <rect x="64" y="64" width="922" height="1472" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Top Jump banner -->
  <rect x="60" y="80" width="200" height="50" rx="6" fill="#e11d48"/>
  <text x="160" y="115" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">SHONEN JUMP</text>
  <text x="940" y="120" fill="#a1a1aa" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" text-anchor="end">VOL. 1</text>

  <!-- Shinigami Apple / Wing Icon -->
  <g transform="translate(525, 460)">
    <!-- Shinigami Wings -->
    <path d="M 0,-30 C -80,-140 -220,-80 -240,40 C -180,60 -100,-20 0,-10 C 100,-20 180,60 240,40 C 220,-80 80,-140 0,-30 Z" fill="#27272a" stroke="#52525b" stroke-width="4"/>
    <!-- Crimson Apple -->
    <circle cx="0" cy="50" r="80" fill="#dc2626" stroke="#991b1b" stroke-width="6"/>
    <!-- Apple leaf & stem -->
    <path d="M 0,-30 Q -10,-60 -20,-70 M 0,-30 Q 30,-50 40,-40" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="25" cy="-45" rx="18" ry="10" fill="#22c55e" transform="rotate(-30 25 -45)"/>
  </g>

  <!-- Big Gothic "DEATH NOTE" Title -->
  <g transform="translate(525, 820)">
    <text x="0" y="8" fill="#000000" font-family="'Old English Text MT', Georgia, serif" font-size="140" font-weight="bold" text-anchor="middle" letter-spacing="12">DEATH NOTE</text>
    <text x="0" y="0" fill="#f8fafc" stroke="#18181b" stroke-width="6" font-family="'Old English Text MT', Georgia, serif" font-size="140" font-weight="bold" text-anchor="middle" letter-spacing="12">DEATH NOTE</text>
  </g>

  <!-- Japanese Kanji: デスノート -->
  <text x="525" y="940" fill="#a1a1aa" font-family="'Noto Sans JP', serif" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="18">デスノート</text>

  <!-- Volume Subtitle: BOREDOM -->
  <rect x="230" y="1040" width="590" height="74" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="525" y="1088" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">VOL. 1: BOREDOM — 退屈</text>

  <!-- Authors: Tsugumi Ohba & Takeshi Obata -->
  <text x="525" y="1300" fill="#ffffff" font-family="Georgia, serif" font-size="38" font-weight="bold" text-anchor="middle" letter-spacing="4">TSUGUMI OHBA · TAKESHI OBATA</text>
  <text x="525" y="1355" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="6">STORY BY OHBA · ART BY OBATA</text>

  <!-- Bottom Bar -->
  <line x1="120" y1="1450" x2="930" y2="1450" stroke="#3f3f46" stroke-width="3"/>
  <text x="525" y="1500" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="6">SHONEN JUMP · VIZ MEDIA</text>
</svg>
